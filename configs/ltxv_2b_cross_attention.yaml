model:
  model_source: "LTXV_2B_0.9.5"   # 13B로 학습하려면 "LTXV_13B_097_DEV"
  training_mode: "lora"
  # load_checkpoint: outputs/checkpoints/lora_weights_step_01500.safetensors  # 여기부터 학습 재개

lora:
  rank: 32  # Optimized for cross attention
  alpha: 32  # Balanced with rank
  dropout: 0.1  # Prevent overfitting
  target_modules: ["to_q","to_k","to_v","to_out.0"]

optimization:
  learning_rate: 1e-4  # Slightly reduced for cross attention stability
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1  # Increased for memory efficiency
  max_grad_norm: 0.1  # Prevent gradient explosion
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true   # Enable for cross attention memory savings

acceleration:
  mixed_precision_mode: "bf16" 
  load_text_encoder_in_8bit: true
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: "/home/jeongseon39/MLLAB/video_gen/datasets/videos/splits/.precomputed"
  num_dataloader_workers: 4
  dataset_size: null  # Set to a number (e.g., 10) to limit dataset size for testing

validation:
  prompts: ["a guy talking in front of a wooden piece of furniture"]
  negative_prompt: "jitter, artifacts, wobble, blur, distortion"
  images: null
  reference_videos: null
  video_dims: [768, 448, 17]
  seed: 42
  inference_steps: 50  # Reduced for cross attention efficiency
  interval: 2  # Less frequent validation to focus on training
  videos_per_prompt: 1
  guidance_scale: 2.0  # Slightly higher for cross attention
  skip_initial_validation: True  # Skip initial validation to start training faster
  enable_multi_shot: True  # Use new cross attention multishot
  num_shots: 2  # Start with 2 shots
  sos_latent_dim: 128

checkpoints:
  interval: 500
  keep_last_n: 3

hub:
  push_to_hub: True
  hub_model_id: "urjeongseon/ltxv_finetuned"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: True
  project: "ltxv-scenegen-training"
  entity: "jeongseon-sogang-university"
  tags: ["ltxv", "scenegen", "cross-attention", "2b"]
  log_validation_videos: true

conditioning:
  mode: "cross_attention"  # NEW: Use cross attention mode
  first_frame_conditioning_p: 0.1
  # Cross attention specific settings
  enable_attention_slicing: true
  attention_slice_size: null  # Auto-detect
  enable_memory_efficient_attention: true

debug:
  enable_debug_frames: true  # Enable debug frame generation
  debug_gpu_id: 2  # Use GPU 2 for debug frames (separate from training)
  debug_interval: 100  # Less frequent for cross attention (more memory intensive)
  enable_batch_visualization: true  # Enable comprehensive batch visualization