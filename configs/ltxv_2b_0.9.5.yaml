model:
  model_source: "LTXV_2B_0.9.5"   # 13B로 학습하려면 "LTXV_13B_097_DEV"
  training_mode: "lora"
  # load_checkpoint: outputs/checkpoints/lora_weights_step_01500.safetensors  # 여기부터 학습 재개

lora:
  rank: 64  # Reduced from 32 to prevent overfitting
  alpha: 64  # Reduced proportionally with rank
  dropout: 0.1  # Added dropout to prevent overfitting
  target_modules: ["to_q","to_k","to_v","to_out.0"]

optimization:
  learning_rate: 2e-4  # Reduced from 1e-5 to prevent model collapse
  steps: 1500
  batch_size: 1
  gradient_accumulation_steps: 8  # Increased from 1 for stable training
  max_grad_norm: 0.1  # Reduced from 1.0 to prevent gradient explosion
  optimizer_type: "adamw"
  scheduler_type: "linear"  # Changed from linear to cosine for smoother learning
  scheduler_params: {}
  enable_gradient_checkpointing: false   # 13B면 true 권장

acceleration:
  mixed_precision_mode: "bf16" 
  load_text_encoder_in_8bit: true
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: "/home/jeongseon38/datasets/videos/splits/.precomputed"
  num_dataloader_workers: 4

validation:
  prompts: ["A chef in a tall white hat is preparing elegant plated desserts with precision, while another man, holding a microphone, is narrating the scene like a TV show host."]
  negative_prompt: "jitter, artifacts, wobble, blur, distortion"
  images: null
  reference_videos: null
  video_dims: [768, 448, 17]
  seed: 42
  inference_steps: 50  # Further reduced for stability
  interval: 100  # Increased even more to reduce training disruption  
  videos_per_prompt: 1
  guidance_scale: 1.5  # Further reduced to prevent model collapse
  skip_initial_validation: True  # Skip initial validation to start training faster
  enable_multi_shot : True  # Re-enabled with fixes
  num_shots : 2  # Start with 2 shots to test sequential conditioning
  sos_latent_dim : 128

checkpoints:
  interval: 500
  keep_last_n: 3

hub:
  push_to_hub: True
  hub_model_id: "merrybabyxmas/SceneGen-Finetuned"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: True  # Enabled with correct entity
  project: "ltxv-scenegen-training"
  entity: "mw990909-sogang-university"  # Correct entity name from wandb account
  tags: ["ltxv", "scenegen", "lora", "2b"]
  log_validation_videos: true

conditioning:
  mode: "none"
  first_frame_conditioning_p: 0.1

debug:
  enable_debug_frames: true  # Enable debug frame generation
  debug_gpu_id: 2  # Use GPU 2 for debug frames (separate from training)
  debug_interval: 50  # Generate debug frames every 50 steps
  enable_batch_visualization: true  # Enable comprehensive batch visualization for first 2 batches
