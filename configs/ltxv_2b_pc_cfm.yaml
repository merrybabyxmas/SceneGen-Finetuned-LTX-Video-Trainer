# LTXV PC-CFM Training Configuration
# Modified Reference Video Training with PC-CFM Loss

model:
  model_source: "LTXV_2B_0.9.5"   
  training_mode: "lora"
  # load_checkpoint: outputs/checkpoints/lora_weights_step_01500.safetensors  # Resume from checkpoint

lora:
  rank: 128  
  alpha: 128  
  dropout: 0.1  
  target_modules: ["to_q","to_k","to_v","to_out.0"]

# SceneGen multishot conditioning configuration
conditioning:
  mode: "reference_video"  # Use reference_video mode (will be handled by SG_training_strategy)
  first_frame_conditioning_p: 0.1

optimization:
  learning_rate: 2e-4  
  steps: 1000
  batch_size: 1
  gradient_accumulation_steps: 1  
  max_grad_norm: 1  
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true   

acceleration:
  mixed_precision_mode: "bf16"
  load_text_encoder_in_8bit: false
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: "/home/jeongseon38/datasets/videos/splits/.precomputed"
  num_dataloader_workers: 4
  dataset_size: 1000  # Set to a number (e.g., 10) to limit dataset size for testing

validation:
  prompts: ["a professional portrait video of the earth"]
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  images: null
  reference_videos: null
  video_dims: [768, 448, 17]
  seed: 42
  inference_steps: 50
  interval: 50
  videos_per_prompt: 1
  guidance_scale: 3.5
  skip_initial_validation: True
  enable_multi_shot: True
  num_shots: 3
  sos_latent_dim: 128
  starts_with: "batch"  # Options: "sos" (generate SOS latents) or "batch" (use current training batch's prev condition)

checkpoints:
  interval: 500
  keep_last_n: 3

hub:
  push_to_hub: True
  hub_model_id: "merrybabyxmas/SceneGen-PC-CFM"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

wandb:
  enabled: True
  project: "ltxv-scenegen-pc-cfm"
  entity: "mw990909-sogang-university"
  tags: ["ltxv", "scenegen", "pc-cfm", "2b"]
  log_validation_videos: true

debug:
  enable_debug_frames: true
  debug_gpu_id: 3
  debug_interval: 50
  enable_batch_visualization: true